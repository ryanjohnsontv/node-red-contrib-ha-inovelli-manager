<script type="text/javascript">
  const NOTIFICATION_MANAGER_BLUE_SWITCHTYPES = ["VZM30-SN", "VZM31-SN", "VZM32-SN", "VZM35-SN"];
  function notificationManagerIsBlueSwitchType(switchtype) {
    return NOTIFICATION_MANAGER_BLUE_SWITCHTYPES.includes(switchtype);
  }
  RED.nodes.registerType("inovelli-notification-manager", {
    category: "inovelli",
    color: "#B68181",
    defaults: {
      name: { value: "" },
      entityid: { value: "" },
      targets: { value: [] },
      friendlyNames: { value: "" },
      color: { value: 0 },
      brightness: { value: 5 },
      duration: { value: 10 },
      effect: { value: 4 },
      switchtype: { value: 8 },
      segment: { value: 0 },
      clear: { value: false },
      multicast: { value: false },
    },
    inputs: 1,
    outputs: 1,
    outputLabels: function () {
      return notificationManagerIsBlueSwitchType(this.switchtype)
        ? "Connect to a core 'mqtt out' node"
        : "Connect to an Action node";
    },
    icon: "light.svg",
    align: "right",
    label: function () {
      return this.name || "inovelli-notification-manager";
    },
    oneditprepare: function () {
      InovelliTargetsEditor.init($("#node-input-targets-container"), this);
      const onOffOptions = `<option value="0">Off</option>
            <option value="1">Solid</option>
            <option value="2">Fast Blink</option>
            <option value="3">Slow Blink</option>
            <option value="4">Pulse</option>`;
      const dimmerOptions = `<option value="0">Off</option>
            <option value="1">Solid</option>
            <option value="2">Chase</option>
            <option value="3">Fast Blink</option>
            <option value="4">Slow Blink</option>
            <option value="5">Pulse</option>`;
      const lzw45Options = `<option value="0">Off</option>
            <option value="1">Solid</option>
            <option value="2">Chase</option>
            <option value="3">Fast Blink</option>
            <option value="4">Slow Blink</option>
            <option value="5">Fast Fade</option>
            <option value="6">Slow Fade</option>`;
      const PIXEL_EFFECT_NAMES = [
        "Static",
        "Blink",
        "Breath",
        "Color Wipe",
        "Color Wipe Reverse Inverse",
        "Color Wipe Random",
        "Random Color",
        "Single Dynamic",
        "Multi Dynamic",
        "Rainbow",
        "Rainbow Cycle",
        "Scan",
        "Dual Scan",
        "Fade",
        "Running Lights",
        "Twinkle",
        "Twinkle Random",
        "Twinkle Fade",
        "Twinkle Fade Random",
        "Sparkle",
        "Flash Sparkle",
        "Hyper Sparkle",
        "Strobe",
        "Blink Rainbow",
        "Chase White",
        "Chase Color",
        "Chase Random",
        "Chase Rainbow",
        "Chase Flash",
        "Chase Flash Random",
        "Chase Rainbow White",
        "Chase Blackout",
        "Chase Blackout Rainbow",
        "Color Sweep Random",
        "Running Color",
        "Running Red Blue",
        "Running Random",
        "Larson Scanner",
        "Comet",
        "Fireworks",
        "Fireworks Random",
        "Merry Christmas",
        "Circus Combustus",
        "Halloween",
        "Aurora",
      ];
      const pixelEffectOptions = PIXEL_EFFECT_NAMES.map(
        (name, i) => `<option value="${i + 1}">${name}</option>`
      ).join("");
      function isPixelEffectMode(switchtype) {
        return String(switchtype) === "31";
      }
      const isBlueSwitchType = notificationManagerIsBlueSwitchType;
      const BLUE_GLOBAL_EFFECTS = [
        "off", "solid", "fast blink", "slow blink", "pulse", "chase", "open close", "small to big",
        "aurora", "slow falling", "medium falling", "fast falling", "slow rising", "medium rising",
        "fast rising", "medium blink", "slow chase", "fast chase", "fast siren", "slow siren",
      ];
      const BLUE_SEGMENT_EFFECTS = [
        "off", "solid", "fast blink", "slow blink", "pulse", "chase", "falling", "rising", "aurora",
      ];
      function titleCase(str) {
        return str.replace(/\b\w/g, (ch) => ch.toUpperCase());
      }
      function blueEffectsForSegment(segment) {
        return Number(segment) > 0 ? BLUE_SEGMENT_EFFECTS : BLUE_GLOBAL_EFFECTS;
      }
      function blueEffectOptions(segment) {
        return blueEffectsForSegment(segment)
          .map((name) => `<option value="${name}">${titleCase(name)}</option>`)
          .join("");
      }
      function refreshBrightnessRange() {
        const isBlue = isBlueSwitchType($("#node-input-switchtype").val());
        $("#node-input-brightness").attr("max", isBlue ? 100 : 10);
      }
      $("#node-input-switchtype").on("change", function () {
        const effectInput = $("#node-input-effect");
        const previous = effectInput.val();
        if (isBlueSwitchType(this.value)) {
          const effects = blueEffectsForSegment($("#node-input-segment").val());
          effectInput.html(blueEffectOptions($("#node-input-segment").val()));
          effectInput.val(effects.includes(previous) ? previous : "solid");
        } else if (isPixelEffectMode(this.value)) {
          effectInput.html(pixelEffectOptions);
          effectInput.val(previous || "1");
        } else if (this.value === "8") {
          effectInput.html(onOffOptions);
          effectInput.val(previous || "1");
        } else if (this.value === "21") {
          effectInput.html(lzw45Options);
          effectInput.val(previous || "1");
        } else {
          effectInput.html(dimmerOptions);
          effectInput.val(previous || "1");
        }
        $("#node-input-effect-label").text(isPixelEffectMode(this.value) ? "Pixel Effect" : "Effect Type");
        $("#node-input-brightness-label").text(
          isPixelEffectMode(this.value) ? "Intensity" : "Brightness Level"
        );
        refreshBrightnessRange();
        refreshProtocolVisibility();
        refreshFieldVisibility();
      });
      $("#node-input-segment").on("change input", function () {
        if (!isBlueSwitchType($("#node-input-switchtype").val())) {
          return;
        }
        const effectInput = $("#node-input-effect");
        const previous = effectInput.val();
        const effects = blueEffectsForSegment(this.value);
        effectInput.html(blueEffectOptions(this.value));
        effectInput.val(effects.includes(previous) ? previous : "solid");
      });
      $("#node-input-switchtype").trigger("change");
      function refreshProtocolVisibility() {
        const protocol = $("#node-input-switchtype option:selected").data("protocol");
        $(".zigbee-only-row").toggle(protocol === "zigbee");
        $(".zwave-only-row").toggle(protocol !== "zigbee");
      }
      refreshProtocolVisibility();
      const HUE_NAMES = [
        "Red",
        "Orange",
        "Yellow",
        "Chartreuse",
        "Green",
        "Spring Green",
        "Cyan",
        "Azure",
        "Blue",
        "Violet",
        "Magenta",
        "Rose",
      ];
      function closestColorName(hue) {
        if (hue >= 361) {
          return "White";
        }
        return HUE_NAMES[Math.round(hue / 30) % 12];
      }
      function refreshColorPreview() {
        const hue = Number($("#node-input-color").val());
        $("#colorSwatch").css("background", hue >= 361 ? "#fff" : `hsl(${hue}, 100%, 50%)`);
        $("#colorOutput").text(`${closestColorName(hue)} (${hue})`);
      }
      $("#node-input-color").on("input change", refreshColorPreview);
      refreshColorPreview();
      $("#node-input-brightness").on("change", function () {
        var brightness = document.getElementById("node-input-brightness");
        var brightnessOutput = document.getElementById("brightnessOutput");
        brightnessOutput.innerHTML = brightness.value;
        brightness.oninput = function () {
          brightnessOutput.innerHTML = this.value;
        };
      });
      function refreshFieldVisibility() {
        const pixelEffect = isPixelEffectMode($("#node-input-switchtype").val());
        const cleared = $("#node-input-clear").is(":checked");
        $(".color-input").toggle(!pixelEffect && !cleared);
        $(".duration-input").toggle(!pixelEffect && !cleared);
        $(".brightness-input").toggle(!cleared);
        $(".effect-input").toggle(!cleared);
        $(".clear-input").toggle(!pixelEffect);
      }
      $("#node-input-clear").on("change", refreshFieldVisibility);
      refreshFieldVisibility();
    },
    oneditsave: function () {
      this.targets = InovelliTargetsEditor.save($("#node-input-targets-container"));
    },
  });
</script>

<script type="text/x-red" data-help-name="inovelli-notification-manager">
    <p>This node will help construct the value for controlling LED notifications on an Inovelli switch. Red Series switches are Z-Wave, and the output should be connected to a Home Assistant Action node. Blue Series switches are Zigbee (via Zigbee2MQTT), and the output should be connected to a core <b>mqtt out</b> node instead - this node automatically emits the right shape for whichever family the selected Switch Type belongs to.</p>
    <dl class="message-properties">
        <dt>Targets<span class="property-type">list</span></dt>
        <dd>Red Series only. Click "add" to add an Entity, Device, Area, Floor, or Label to send this node's Z-Wave commands to, matching the Home Assistant Action node's own Targets picker. Add as many rows of any type/combination as needed. Every target type is also configurable ad-hoc via its own payload field - <code>msg.payload.entity_id</code>, <code>msg.payload.device_id</code>, <code>msg.payload.area_id</code>, <code>msg.payload.floor_id</code>, <code>msg.payload.label_id</code> (each a single ID, a comma-delimited list, or an array) - and each independently replaces only that target type's configured rows for that run, leaving the others untouched. Any configured Entity targets are also set on a top-level <code>msg.entity_id</code> (in addition to <code>msg.payload.target.entity_id</code>), for downstream Action nodes whose own Target field is configured to read directly from <code>msg.entity_id</code>.</dd>

        <dt>Friendly Name(s)<span class="property-type">string</span></dt>
        <dd>Blue Series only. The Zigbee2MQTT friendly name(s) of the device(s) to send this node's commands to - a single name, or a comma-delimited list to send to multiple devices. Also configurable ad-hoc via <code>msg.payload.friendly_name</code>, which replaces the configured list for that run only. Each targeted device is sent as its own <code>{topic, payload}</code> message (e.g. <code>zigbee2mqtt/Kitchen Dimmer/set/led_effect</code>), since MQTT has no equivalent to a single Home Assistant service call fanning out to multiple devices.</dd>

        <dt>Switch Type<span class="property-type">number|string</span></dt>
        <dd>Determines which parameter to set, and whether this node behaves as a Red Series (Z-Wave/Action node) or Blue Series (Zigbee/MQTT) node. (LZW30-SN, LZW31-SN, LZW36 (fan and/or light), LZW45 Quick Effect, LZW45 Pixel Effect, or VZM30-SN/VZM31-SN/VZM32-SN/VZM35-SN for Blue Series). Also configurable via <code>msg.payload.switchtype</code>.</dd>

        <dt>Segment<span class="property-type">number</span></dt>
        <dd>Blue Series only. Which of the LED bar's 7 individually-addressable segments to target: 0 (the default) addresses the whole bar (the <code>led_effect</code> MQTT property), 1-7 addresses that one segment (the <code>individual_led_effect</code> property, with a smaller effect vocabulary). Also configurable via <code>msg.payload.segment</code>.</dd>

        <dt>Color<span class="property-type">number|string|array</span></dt>
        <dd>Color you want to display (accepts color names, RGB arrays, hexadeciaml and 0-360* hue values) *361=white. Not used for LZW45 Pixel Effect. For Blue Series this is sent as the 0-255 hue-scale <code>color</code> property (255 = white).</dd>

        <dt>Brightness Level / Intensity<span class="property-type">number</span></dt>
        <dd>Brightness/intensity of the LED light for the notification. 0-10 for Red Series (LZW45, both Quick Effect and Pixel Effect, scales this to its native 0-99 intensity range). For Blue Series this is 0-100, sent directly as the native <code>level</code> property.</dd>

        <dt>Duration<span class="property-type">number|string</span></dt>
        <dd>Duration to display the notification. Not used for LZW45 Pixel Effect. Same 0-255 encoding (seconds/minutes/hours/indefinitely) for Blue Series, sent as the <code>duration</code> property.</dd>

        <dt>Effect<span class="property-type">number|string</span></dt>
        <dd>Effect for the notification. Options depend on switch type: Off/Solid/Chase/Fast Blink/Slow Blink/Pulse for Red Series switches and dimmers, plus Fast Fade/Slow Fade for LZW45 Quick Effect, or one of 45 built-in animations (Rainbow, Fireworks, Aurora, etc.) for LZW45 Pixel Effect. For Blue Series, options depend on the Segment field: 20 global effects (Open/Close, Small to Big, Aurora, Falling/Rising variants, etc.) for the whole bar (Segment 0), or 9 for an individual segment (Segment 1-7).</dd>

        <dt>Clear Notification<span class="property-type">boolean</span></dt>
        <dd>Check this box or set msg.payload.clear to true to clear the current LED notification. Not available for LZW45 Pixel Effect, which has no notification/clear concept of its own. For Blue Series this sends the <code>clear_effect</code> effect (valid for both global and per-segment notifications) and works for every Blue Series switch type.</dd>

        <dt>Multicast<span class="property-type">boolean</span></dt>
        <dd>Red Series only. Check this box if your devices are set up to support multicasting. Also configurable via <code>msg.payload.multicast</code>.</dd>
    </dl>
    <p>
      It is possible to override values set on this node by passing values in a payload e.g.
      <pre>
  msg = {
    payload: {
      entity_id: "light.bedroom",
      color: "Red",
      duration: "10 Seconds",
      effect: "Slow Blink",
      brightness: 10,
      switchtype: "combo_fan"
    }
  }

  or, for an LZW45 Pixel Effect

  msg = {
    payload: {
      entity_id: "light.bedroom",
      effect: "Rainbow",
      brightness: 5,
      switchtype: "pixel effect"
    }
  }

  or, for a Blue Series switch (global LED bar notification)

  msg = {
    payload: {
      friendly_name: "Kitchen Dimmer",
      color: "Red",
      duration: "10 seconds",
      effect: "fast blink",
      brightness: 75,
      switchtype: "vzm31-sn"
    }
  }

  or, targeting an individual segment

  msg = {
    payload: {
      friendly_name: "Kitchen Dimmer",
      segment: 3,
      effect: "falling",
      brightness: 50,
      switchtype: "vzm31-sn"
    }
  }
      </pre>
    </p>
</script>
