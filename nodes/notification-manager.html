<script type="text/javascript">
  RED.nodes.registerType("inovelli-notification-manager", {
    category: "inovelli",
    color: "#B68181",
    defaults: {
      name: { value: "" },
      entityid: { value: "" },
      color: { value: 0 },
      brightness: { value: 5 },
      duration: { value: 10 },
      effect: { value: 4 },
      switchtype: { value: 8 },
      clear: { value: false },
      multicast: { value: false },
    },
    inputs: 1,
    outputs: 1,
    outputLabels: "Connect to a call-service node",
    icon: "light.svg",
    align: "right",
    label: function () {
      return this.name || "inovelli-notification-manager";
    },
    oneditprepare: function () {
      const onOffOptions = `<option value="0">Off</option>
          <option value="1">Solid</option>
          <option value="2">Fast Blink</option>
          <option value="3">Slow Blink</option>
          <option value="4">Pulse</option>`;

      const dimmerOptions = `<option value="0">Off</option>
          <option value="1">Solid</option>
          <option value="2">Chase</option>
          <option value="3">Fast Blink</option>
          <option value="4">Slow Blink</option>
          <option value="5">Pulse</option>`;

      const lzw45Options = `<option value="0">Off</option>
          <option value="1">Solid</option>
          <option value="2">Chase</option>
          <option value="3">Fast Blink</option>
          <option value="4">Slow Blink</option>
          <option value="5">Fast Fade</option>
          <option value="6">Slow Fade</option>`;

      // LZW45 parameter 31 "Pixel Effect" - 45 built-in animations, numbered
      // 1-45 (no "Off" - this parameter has no notification/clear concept).
      // Kept in the same order/numbering as PIXEL_EFFECTS in
      // nodes/shared/switches.ts (transcribed from zwave-js's device config).
      const PIXEL_EFFECT_NAMES = [
        "Static", "Blink", "Breath", "Color Wipe", "Color Wipe Reverse Inverse",
        "Color Wipe Random", "Random Color", "Single Dynamic", "Multi Dynamic",
        "Rainbow", "Rainbow Cycle", "Scan", "Dual Scan", "Fade", "Running Lights",
        "Twinkle", "Twinkle Random", "Twinkle Fade", "Twinkle Fade Random",
        "Sparkle", "Flash Sparkle", "Hyper Sparkle", "Strobe", "Blink Rainbow",
        "Chase White", "Chase Color", "Chase Random", "Chase Rainbow",
        "Chase Flash", "Chase Flash Random", "Chase Rainbow White",
        "Chase Blackout", "Chase Blackout Rainbow", "Color Sweep Random",
        "Running Color", "Running Red Blue", "Running Random", "Larson Scanner",
        "Comet", "Fireworks", "Fireworks Random", "Merry Christmas",
        "Circus Combustus", "Halloween", "Aurora",
      ];
      const pixelEffectOptions = PIXEL_EFFECT_NAMES.map(
        (name, i) => `<option value="${i + 1}">${name}</option>`
      ).join("");

      function isPixelEffectMode(switchtype) {
        return String(switchtype) === "31";
      }

      $("#node-input-switchtype").on("change", function () {
        const effectInput = $("#node-input-effect");
        const previous = effectInput.val();
        if (isPixelEffectMode(this.value)) {
          effectInput.html(pixelEffectOptions);
        } else if (this.value === "8") {
          effectInput.html(onOffOptions);
        } else if (this.value === "21") {
          effectInput.html(lzw45Options);
        } else {
          effectInput.html(dimmerOptions);
        }
        effectInput.val(previous || "1");
        $("#node-input-effect-label").text(isPixelEffectMode(this.value) ? "Pixel Effect" : "Effect Type");
        $("#node-input-brightness-label").text(isPixelEffectMode(this.value) ? "Intensity" : "Brightness Level");
        refreshFieldVisibility();
      });
      $("#node-input-switchtype").trigger("change");

      // Rough 12-band approximation of the closest named color for a 0-360
      // hue (361 is the reserved "white" sentinel) - just a friendly label
      // next to the slider, the raw hue is still what gets sent.
      const HUE_NAMES = [
        "Red", "Orange", "Yellow", "Chartreuse", "Green", "Spring Green",
        "Cyan", "Azure", "Blue", "Violet", "Magenta", "Rose",
      ];
      function closestColorName(hue) {
        if (hue >= 361) {
          return "White";
        }
        return HUE_NAMES[Math.round(hue / 30) % 12];
      }
      function refreshColorPreview() {
        const hue = Number($("#node-input-color").val());
        $("#colorSwatch").css("background", hue >= 361 ? "#fff" : `hsl(${hue}, 100%, 50%)`);
        $("#colorOutput").text(`${closestColorName(hue)} (${hue})`);
      }
      $("#node-input-color").on("input change", refreshColorPreview);
      refreshColorPreview();
      $("#node-input-brightness").on("change", function () {
        var brightness = document.getElementById("node-input-brightness");
        var brightnessOutput = document.getElementById("brightnessOutput");
        brightnessOutput.innerHTML = brightness.value;
        brightness.oninput = function () {
          brightnessOutput.innerHTML = this.value;
        };
      });
      function refreshFieldVisibility() {
        const pixelEffect = isPixelEffectMode($("#node-input-switchtype").val());
        const cleared = $("#node-input-clear").is(":checked");
        // Pixel Effect has no color/duration/clear concept at all, so those
        // stay hidden regardless of the Clear checkbox; otherwise Clear
        // behaves as before, hiding everything but itself.
        $(".color-input").toggle(!pixelEffect && !cleared);
        $(".duration-input").toggle(!pixelEffect && !cleared);
        $(".brightness-input").toggle(!cleared);
        $(".effect-input").toggle(!cleared);
        $(".clear-input").toggle(!pixelEffect);
      }
      $("#node-input-clear").on("change", refreshFieldVisibility);
      refreshFieldVisibility();
    },
  });
</script>

  </div>
  <div class="form-row effect-input">
    <label for="node-input-effect"><i class="icon-tag"></i><span id="node-input-effect-label">Effect Type</span></label>
    <select name="node-input-effect" id="node-input-effect">
        <option value="0">Placeholder</option>

  <div class="form-row clear-input">

  <div class="form-row multicast-input">

<script type="text/x-red" data-help-name="inovelli-notification-manager">
    <p>This node will help construct the value for controlling LED notifications on an Inovelli Red Series switch. The output should be connected to a Home Assistant call service node.</p>
    <dl class="message-properties">
        <dt>Entity ID(s)<span class="property-type">string</span></dt>
        <dd>Entity (or a comma-delimited list of entity IDs) to set the configuration parameter on. Also configurable via <code>msg.payload.entity_id</code>.</dd>

        <dt>Switch Type<span class="property-type">number|string</span></dt>
        <dd>Determines which parameter to set. (LZW30-SN, LZW31-SN, LZW36 (fan and/or light), LZW45 Quick Effect, LZW45 Pixel Effect)</dd>

        <dt>Color<span class="property-type">number|string|array</span></dt>
        <dd>Color you want to display (accepts color names, RGB arrays, hexadeciaml and 0-360* hue values) *361=white. Not used for LZW45 Pixel Effect.</dd>

        <dt>Brightness Level / Intensity<span class="property-type">number</span></dt>
        <dd>Brightness/intensity of the LED light (0-10) for the notification. For LZW45 (both Quick Effect and Pixel Effect) this is scaled to its native 0-99 intensity range.</dd>

        <dt>Duration<span class="property-type">number|string</span></dt>
        <dd>Duration to display the notification. Not used for LZW45 Pixel Effect.</dd>

        <dt>Effect<span class="property-type">number|string</span></dt>
        <dd>Effect for the notification. Options depend on switch type: Off/Solid/Chase/Fast Blink/Slow Blink/Pulse for switches and dimmers, plus Fast Fade/Slow Fade for LZW45 Quick Effect, or one of 45 built-in animations (Rainbow, Fireworks, Aurora, etc.) for LZW45 Pixel Effect.</dd>

        <dt>Clear Notification<span class="property-type">boolean</span></dt>
        <dd>Check this box or set msg.payload.clear to true to clear the current LED notification. Not available for LZW45 Pixel Effect, which has no notification/clear concept of its own.</dd>

        <dt>Multicast<span class="property-type">boolean</span></dt>
        <dd>Check this box if your devices are set up to support multicasting</dd>
    </dl>
    <p>
      It is possible to override values set on this node by passing values in a payload e.g.
      <pre>
  msg = {
    payload: {
      entity_id: "light.bedroom",
      color: "Red",
      duration: "10 Seconds",
      effect: "Slow Blink",
      brightness: 10,
      switchtype: "combo_fan"
    }
  }

  or, for an LZW45 Pixel Effect

  msg = {
    payload: {
      entity_id: "light.bedroom",
      effect: "Rainbow",
      brightness: 5,
      switchtype: "pixel effect"
    }
  }
      </pre>
    </p>
</script>
