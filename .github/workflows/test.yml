name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: '24.x'
    - run: npm ci
    - run: npm run lint
    - run: npm run format:check
    - run: npm test
