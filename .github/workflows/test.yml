name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.0.0
    - uses: actions/setup-node@v3.8.1
      with:
        node-version: '20.x'
    - run: npm ci
    - run: npm run lint
    - run: npm run format:check
    - run: npm test
